name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate the fictional example
        run: python scripts/validate.py examples/fictional/guide.json --today 2026-10-08
      - name: Rebuild the example and check the committed page is up to date
        run: |
          python scripts/build_guide.py examples/fictional/guide.json --out-dir examples/fictional/out --today 2026-10-08
          git diff --exit-code -- examples/fictional/out
